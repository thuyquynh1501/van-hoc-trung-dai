<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Văn Học Trung Đại Việt Nam - Chuẩn Học Thuật & Sư Phạm GDPT 2018</title>
  <meta name="description" content="Trang web lưu trữ tác phẩm, tra cứu dịch song song Chữ Hán - Nôm, giải nghĩa Điển tích, soi luật Bằng-Trắc, kho tài liệu Word/PPT/PDF, kho Slide giảng dạy, liên kết trò chơi Kahoot/Quizizz/Wordwall và bộ tạo so sánh văn bản.">
  
    <script>
    window.isTeacher = localStorage.getItem('IS_TEACHER') === 'true';
    if (window.isTeacher) document.documentElement.classList.add('teacher-mode');
    
    function toggleTeacherMode() {
      if (window.isTeacher) {
        localStorage.removeItem('IS_TEACHER');
        alert("Đã thoát chế độ Giáo viên. Hiện đang ở góc nhìn Học sinh.");
        location.reload();
      } else {
        const pass = prompt("Nhập mật khẩu Giáo viên (Mặc định: giaovien123):");
        if (pass === "giaovien123") {
          localStorage.setItem('IS_TEACHER', 'true');
          alert("Xác thực thành công! Đã mở khóa các tính năng quản lý.");
          location.reload();
        } else if (pass !== null) {
          alert("Sai mật khẩu!");
        }
      }
    }
  </script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="app-container">
    <!-- Sidebar Left Navigation -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo-badge">文</div>
        <div class="logo-title">
          <h1>Văn Học Trung Đại</h1>
          <p>Giảng Dạy & Tra Cứu</p>
        </div>
      </div>

      <nav class="sidebar-nav">
        <a class="nav-item active" data-view="library">
          <i class="fa-solid fa-book-bookmark"></i>
          <span>Thư Viện Tác Phẩm</span>
        </a>
        <a class="nav-item" data-view="reader">
          <i class="fa-solid fa-scroll"></i>
          <span>Đọc Hán - Nôm & Tra Cứu</span>
        </a>
        <a class="nav-item teacher-only-flex" data-view="slide-builder">
          <i class="fa-solid fa-chalkboard-user"></i>
          <span>Slide Giảng Dạy</span>
        </a>
        <a class="nav-item" data-view="documents">
          <i class="fa-solid fa-folder-open"></i>
          <span>Kho Tài Liệu (Word/PPT/PDF)</span>
        </a>
        <a class="nav-item" data-view="games">
          <i class="fa-solid fa-gamepad"></i>
          <span>Trò Chơi Học Tập (Kahoot...)</span>
        </a>
        <a class="nav-item" data-view="comparative">
          <i class="fa-solid fa-columns"></i>
          <span>So Sánh Văn Bản</span>
        </a>
        <a class="nav-item" data-view="authors">
          <i class="fa-solid fa-users-viewfinder"></i>
          <span>Tác Giả Tiêu Biểu</span>
        </a>
        <a class="nav-item" data-view="periods">
          <i class="fa-solid fa-timeline"></i>
          <span>Tiến Trình Lịch Sử</span>
        </a>
        <a class="nav-item" data-view="writing">
          <i class="fa-solid fa-pen-nib"></i>
          <span>Viết Ngắn GDPT 2018</span>
        </a>
        <a class="nav-item" data-view="quizzes">
          <i class="fa-solid fa-circle-question"></i>
          <span>Câu Hỏi Củng Cố</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <button class="ambient-audio-btn" onclick="const playing = ambientPlayer.toggle(); this.querySelector('span').innerText = playing ? 'Tắt Âm Nhạc Dân Tộc' : 'Phát Nhạc Đàn Tranh';">
          <i class="fa-solid fa-music"></i>
          <span>Phát Nhạc Đàn Tranh</span>
        </button>

        <button class="theme-toggle-btn" onclick="app.toggleTheme()">
          <i class="fa-solid fa-circle-half-stroke"></i>
          <span>Chế độ Sáng / Tối</span>
        </button>
      
      </div>
    </aside>

    <!-- Main Content Area -->
    <div class="main-wrapper">
      <!-- Top Header -->
      <header class="top-header">
        <div class="header-search">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="global-search" placeholder="Tìm tác phẩm (Bình Ngô Đại Cáo, Truyện Kiều, Hịch Tướng Sĩ...)...">
        </div>

        <div class="header-actions">
          <button class="btn btn-outline teacher-only" onclick="app.renderView('slide-builder')">
            <i class="fa-solid fa-chalkboard-user"></i> Slide Giảng Dạy
          </button>
          <button class="btn btn-primary" onclick="app.renderView('library')">
            <i class="fa-solid fa-house"></i> Trang Chủ
          </button>
          <button class="btn btn-outline" style="border-color: #8854D0; color: #8854D0; font-weight: bold; margin-left: 10px;" onclick="toggleTeacherMode()">
            <i class="fa-solid fa-user-shield"></i> <span id="auth-label">Đăng Nhập</span>
          </button>
          <script>document.getElementById('auth-label').innerText = window.isTeacher ? 'Thoát' : 'Giáo viên';</script>
        </div>
      </header>

      <!-- Content Body -->
      <main class="content-body" id="app-content-body">
        <!-- Rendered dynamically by app.js -->
      </main>
    </div>
  </div>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-init.js"></script>

  <!-- App Scripts -->
  <script src="js/data.js"></script>
  <script src="js/mindmap.js"></script>
  <script src="js/documents.js"></script>
  <script src="js/games.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/slides.js"></script>
  <script src="js/reader.js"></script>
  <script src="js/app.js"></script>

  <!-- Modal Thêm Tác Phẩm -->
  <div id="add-work-modal" class="modal-overlay" style="display:none;" onclick="app.closeAddWorkModal()">
    <div class="modal-card animated-fade-in" onclick="event.stopPropagation()">
      <h3 style="font-family:var(--font-heading); color:var(--primary); margin-bottom:15px;">Thêm Tác Phẩm Mới</h3>
      <div style="margin-bottom:10px;">
        <label style="display:block; font-weight:600; font-size:0.85rem; margin-bottom:4px;">Tên Tác Phẩm:</label>
        <input type="text" id="new-work-title" style="width:100%; padding:8px 12px; border-radius:8px; border:1px solid var(--border-color); background:var(--bg-parchment);">
      </div>
      <div style="margin-bottom:10px;">
        <label style="display:block; font-weight:600; font-size:0.85rem; margin-bottom:4px;">Tác Giả:</label>
        <input type="text" id="new-work-author" style="width:100%; padding:8px 12px; border-radius:8px; border:1px solid var(--border-color); background:var(--bg-parchment);">
      </div>
      <div style="margin-bottom:10px;">
        <label style="display:block; font-weight:600; font-size:0.85rem; margin-bottom:4px;">Năm / Giai đoạn:</label>
        <input type="text" id="new-work-year" style="width:100%; padding:8px 12px; border-radius:8px; border:1px solid var(--border-color); background:var(--bg-parchment);">
      </div>
      <div style="margin-bottom:10px;">
        <label style="display:block; font-weight:600; font-size:0.85rem; margin-bottom:4px;">Thể loại:</label>
        <input type="text" id="new-work-genre" style="width:100%; padding:8px 12px; border-radius:8px; border:1px solid var(--border-color); background:var(--bg-parchment);">
      </div>
      <div style="margin-bottom:15px;">
        <label style="display:block; font-weight:600; font-size:0.85rem; margin-bottom:4px;">Mô tả / Tóm tắt:</label>
        <textarea id="new-work-desc" rows="3" style="width:100%; padding:8px 12px; border-radius:8px; border:1px solid var(--border-color); background:var(--bg-parchment);"></textarea>
      </div>
      <div style="text-align:right;">
        <button class="btn btn-outline" onclick="app.closeAddWorkModal()">Hủy</button>
        <button class="btn btn-primary" onclick="app.saveNewWork()">Lưu Tác Phẩm</button>
      </div>
    </div>
  </div>

</body>
</html>
